[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzydiary"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
"numpy>=1.24",
"pandas>=2.0",
"scipy>=1.10",
"scikit-learn>=1.3",
"scikit-fuzzy>=0.4",
"rdp>=0.8",
"pydantic>=2.0",
"PyYAML>=6.0",
"plotly>=5.0",
"jinja2>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
